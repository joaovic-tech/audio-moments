<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Grave conversas, marque momentos importantes e exporte o projeto. Tudo processado localmente no navegador." />
    <meta name="theme-color" content="#e1e2e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1b26" media="(prefers-color-scheme: dark)" />
    <title>Audio Moments</title>
    <script>
      // Aplica o tema antes da renderização para evitar o "flash" de tema errado.
      // A chave deve ser a mesma de THEME_STORAGE_KEY (src/lib/theme.ts).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("audio-moments:theme");
        } catch (e) {}
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
